name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Install
        run: uv sync --python 3.12 --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests
        run: uv run pytest
      - name: requirements.txt matches uv.lock
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt -o /tmp/req.txt
          diff <(grep -v '^#' /tmp/req.txt) <(grep -v '^#' ../requirements.txt)

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, Chrome)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project ../backend --python 3.12 --frozen
      - run: npm ci
      - run: npm run build
      - name: Playwright (system Google Chrome)
        run: npx playwright test
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  docker:
    name: Docker image (build + smoke test)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t winddesk:ci .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name winddesk winddesk:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/v1/health && break; sleep 1; done
          curl -fsS "http://localhost:8000/api/v1/decisions/2026-01-15?gate=09:50" | grep -q '"delivery_date":"2026-01-16"'
          curl -fsS http://localhost:8000/brief | grep -q WindDesk
          curl -fsSI http://localhost:8000/brief | grep -qi '^content-security-policy:'
          docker logs winddesk | tail -5
